name: PR Preview

on:
  workflow_run:
    workflows: ["Test site build"]
    types: [completed]
  pull_request_target:
    types: [closed]

jobs:
  deploy-preview:
    if: >
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download generated site
        uses: actions/download-artifact@v8
        with:
          name: generated-site
          path: ./site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PR number
        uses: actions/download-artifact@v8
        with:
          name: pr-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR number
        id: pr
        run: |
          PR_NUMBER=$(cat pr-number.txt | tr -dc '0-9')
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::pr-number.txt does not contain a valid PR number"
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Install Surge
        run: npm install -g surge

      - name: Deploy to Surge
        run: surge ./site "$PREVIEW_URL" --token "$SURGE_TOKEN"
        env:
          PREVIEW_URL: pr-${{ steps.pr.outputs.number }}-wildfly-org.surge.sh
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

      - name: Comment on PR
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const previewUrl = `https://pr-${prNumber}-wildfly-org.surge.sh`;
            const body = `A preview of this PR is available at ${previewUrl}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('A preview of this PR is available at')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
            }

  teardown-preview:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Install Surge
        run: npm install -g surge

      - name: Teardown preview
        run: surge teardown pr-${PR_NUMBER}-wildfly-org.surge.sh --token "$SURGE_TOKEN"
        env:
          PR_NUMBER: ${{ github.event.number }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}